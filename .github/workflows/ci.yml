name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Ban skipped tests (D-04)
        run: bash ci/check-no-skip.sh
      - name: compile + enforcer + surefire + failsafe
        working-directory: server
        run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: lint and typecheck
        run: pnpm lint
      - name: OpenAPI types
        working-directory: ${{ github.workspace }}
        run: bash ci/check-openapi-types.sh
      - name: unit tests
        run: pnpm test
      # Playwright journeys (web/e2e) are skeletons in task 39; CI blocking E2E is task 43.

  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: R31.1 compose smoke
        run: bash ci/deploy-smoke.sh
