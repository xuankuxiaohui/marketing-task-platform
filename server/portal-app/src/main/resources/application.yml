spring:
  application:
    name: portal-app
  flyway:
    enabled: false
  datasource:
    url: ${MKT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/mkt_platform?characterEncoding=utf8mb4&connectionTimeZone=UTC}
    username: ${MKT_DATASOURCE_USERNAME:mkt}
    password: ${MKT_DATASOURCE_PASSWORD:}

mkt:
  outbox:
    producer: portal
  track:
    batch-max-size: 50
    event-max-payload-kb: 8
    unregistered-policy: accept
    disabled-event-policy: drop-count
    rate-limit-per-minute: 60
    query-sample-ratio-percent: 1
    query-rate-limit-per-minute: 60
    retention-event-days: 90


springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    enabled: false
