spring:
  application:
    name: portal-app
  flyway:
    enabled: ${MKT_FLYWAY_ENABLED:false}
  datasource:
    url: ${MKT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/mkt_platform?characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${MKT_DATASOURCE_USERNAME:mkt}
    password: ${MKT_DATASOURCE_PASSWORD:}
    hikari:
      # Dual portal under list load: default 10 starved Tomcat workers (R6 #139 FAIL).
      # portal×2×40 + admin×20 = 100 < MySQL max_connections 151. Not a DEC-006 threshold change.
      maximum-pool-size: ${MKT_HIKARI_MAX_POOL:40}
      minimum-idle: ${MKT_HIKARI_MIN_IDLE:10}

server:
  port: ${SERVER_PORT:8081}
  # Dual portal under list 500 QPS: accept queue absorbs brief spikes; thread max capped so
  # native stacks + MaxRAMPercentage=75% heap fit DEC-006 1536M memcg (300→OOM under p1).
  # Post-#159 residual dropped: default 160 (was 120) — peak active VUs≈258 > 120×2; never 200–250.
  # Env-tunable on Compose mkt; not a DEC-006 threshold change; memory limit unchanged.
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:160}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE:30}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:400}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

mkt:
  outbox:
    producer: portal
    # DEC-002 starters (tunable via load test; not DEC-006 capacity gate)
    batch-size: 100
    lock-hold-budget-ms: 2000
  track:
    batch-max-size: 50
    event-max-payload-kb: 8
    unregistered-policy: accept
    disabled-event-policy: drop-count
    rate-limit-per-minute: 60
    query-sample-ratio-percent: 1
    query-rate-limit-per-minute: 60
    retention-event-days: 90


springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    enabled: false
