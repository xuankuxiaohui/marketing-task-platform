spring:
  application:
    name: admin-app
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${MKT_FLYWAY_USER:${MKT_DATASOURCE_USERNAME:mkt}}
    password: ${MKT_FLYWAY_PASSWORD:${MKT_DATASOURCE_PASSWORD:}}
  datasource:
    url: ${MKT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/mkt_platform?characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${MKT_DATASOURCE_USERNAME:mkt}
    password: ${MKT_DATASOURCE_PASSWORD:}
    hikari:
      # Keep below MySQL max_connections with portal×2 pools. Not a DEC-006 threshold change.
      maximum-pool-size: ${MKT_HIKARI_MAX_POOL:20}
      minimum-idle: ${MKT_HIKARI_MIN_IDLE:5}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

mkt:
  alert:
    webhook-url: ${MKT_ALERT_WEBHOOK_URL:}
  outbox:
    producer: admin
    # DEC-002 starters (tunable via load test; not DEC-006 capacity gate)
    batch-size: 100
    lock-hold-budget-ms: 2000
  track:
    retention-event-days: 90
    query-sample-ratio-percent: 1
    query-rate-limit-per-minute: 60
  # Capacity measurement hygiene: set MKT_METRICS_AGGREGATE_ENABLED=false on throwaway mkt
  # during advance formal to stop mtr_* JSON agg co-load. Default true (production unchanged).
  metrics:
    aggregate:
      enabled: ${MKT_METRICS_AGGREGATE_ENABLED:true}

springdoc:
  api-docs:
    path: /admin/v3/api-docs
  swagger-ui:
    enabled: false
