# Public gateway (design §2.3.2 / 14-deployment §6). No /internal. No /actuator.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr $request_id $http_x_trace_id $status $request';
    access_log /dev/stdout main;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;

    upstream admin_app {
        server admin-app:8080;
    }

    upstream portal_app {
        server portal-app-1:8081;
        server portal-app-2:8081;
    }

    map $http_x_trace_id $trace_id {
        default $http_x_trace_id;
        ""      $request_id;
    }

    # CORS is off by default (same-origin). Versioned allowlist belongs in a
    # separate file when a public origin is introduced (NFR 安全 6).

    server {
        listen 80 default_server;
        server_name _;

        # TLS 1.2+ is required in production (NFR 安全 1). See tls.conf.example.

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $trace_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Client-Platform $http_x_client_platform;
        proxy_set_header X-Device-Id $http_x_device_id;
        proxy_set_header X-App-Id $http_x_app_id;
        proxy_set_header X-Timestamp $http_x_timestamp;
        proxy_set_header X-Nonce $http_x_nonce;
        proxy_set_header X-Sign $http_x_sign;
        proxy_hide_header X-Powered-By;
        add_header X-Trace-Id $trace_id always;

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /admin/ {
            proxy_pass http://admin_app;
        }

        location /api/ {
            proxy_pass http://portal_app;
        }

        # Must not proxy internal callbacks or actuator to the public listener.
        location /internal {
            return 404;
        }

        location /actuator {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
