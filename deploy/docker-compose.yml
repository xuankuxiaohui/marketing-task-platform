# Dev/test stack (R31.1 / design §2.4.2 / §2.6). Host ports avoid 3308 / 6379 / 8080 / 8081.
# Usage: cp deploy/.env.example deploy/.env && docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
name: mkt

x-app-env: &app-env
  TZ: UTC
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  MKT_DATASOURCE_URL: ${MKT_DATASOURCE_URL}
  MKT_DATASOURCE_USERNAME: ${MKT_DATASOURCE_USERNAME}
  MKT_DATASOURCE_PASSWORD: ${MKT_DATASOURCE_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DATABASE: "2"
  MKT_REDIS_HOST: ${MKT_REDIS_HOST}
  MKT_REDIS_PORT: ${MKT_REDIS_PORT}
  MKT_REDIS_PASSWORD: ${MKT_REDIS_PASSWORD}
  MKT_REDIS_DATABASE: "2"
  MKT_SA_TOKEN_JWT_SECRET: ${MKT_SA_TOKEN_JWT_SECRET}
  MKT_INTERNAL_APP_AES_KEY: ${MKT_INTERNAL_APP_AES_KEY}
  MKT_ALERT_WEBHOOK_URL: ${MKT_ALERT_WEBHOOK_URL:-}

x-app-resources: &app-resources
  limits:
    cpus: "2.0"
    memory: 1G
  reservations:
    cpus: "0.25"
    memory: 256M

services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MKT_FLYWAY_USER: ${MKT_FLYWAY_USER}
      MKT_FLYWAY_PASSWORD: ${MKT_FLYWAY_PASSWORD}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--databases", "16"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  admin-app:
    build:
      context: ../server/admin-app/target
      dockerfile: ../../deploy/docker/Dockerfile
      args:
        JAR_FILE: admin-app-0.1.0-SNAPSHOT.jar
    environment:
      <<: *app-env
      SERVER_PORT: "8080"
      SPRING_FLYWAY_ENABLED: "true"
      MKT_FLYWAY_USER: ${MKT_FLYWAY_USER}
      MKT_FLYWAY_PASSWORD: ${MKT_FLYWAY_PASSWORD}
      MKT_INIT_ADMIN_PASSWORD: ${MKT_INIT_ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    deploy:
      resources: *app-resources
    restart: unless-stopped

  portal-app-1:
    build:
      context: ../server/portal-app/target
      dockerfile: ../../deploy/docker/Dockerfile
      args:
        JAR_FILE: portal-app-0.1.0-SNAPSHOT-exec.jar
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      SPRING_FLYWAY_ENABLED: "false"
      MKT_FLYWAY_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    deploy:
      resources: *app-resources
    restart: unless-stopped

  portal-app-2:
    build:
      context: ../server/portal-app/target
      dockerfile: ../../deploy/docker/Dockerfile
      args:
        JAR_FILE: portal-app-0.1.0-SNAPSHOT-exec.jar
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      SPRING_FLYWAY_ENABLED: "false"
      MKT_FLYWAY_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    deploy:
      resources: *app-resources
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      admin-app:
        condition: service_healthy
      portal-app-1:
        condition: service_healthy
      portal-app-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      admin-app:
        condition: service_healthy
      portal-app-1:
        condition: service_healthy
      portal-app-2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  prometheus-data:
