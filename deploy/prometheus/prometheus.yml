# Internal scrape only. Do not publish this listener on a public interface
# except 127.0.0.1 for local compose (R31 / design §2.3.3).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: admin-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["admin-app:8080"]
        labels:
          app: admin-app

  - job_name: portal-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - portal-app-1:8081
          - portal-app-2:8081
        labels:
          app: portal-app
